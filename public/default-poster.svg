<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181c"/>
      <stop offset="40%" stop-color="#0f1015"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>

    <!-- Deep Crimson Cinema Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#e50914" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#831010" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Top Ambient Highlight -->
    <linearGradient id="topGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Red Ribbon Gradient -->
    <linearGradient id="redN1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#b81d24"/>
    </linearGradient>
    <linearGradient id="redN2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff2e35"/>
      <stop offset="100%" stop-color="#991217"/>
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#e50914" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="600" height="900" fill="url(#bgGrad)"/>
  <rect width="600" height="900" fill="url(#centerGlow)"/>
  <rect width="600" height="900" fill="url(#topGlow)"/>

  <!-- Cinema Frame Borders -->
  <rect x="24" y="24" width="552" height="852" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Subtle Film Perforations / Pattern -->
  <g opacity="0.12" fill="#ffffff">
    <rect x="36" y="44" width="8" height="12" rx="2"/>
    <rect x="36" y="68" width="8" height="12" rx="2"/>
    <rect x="36" y="92" width="8" height="12" rx="2"/>
    <rect x="36" y="796" width="8" height="12" rx="2"/>
    <rect x="36" y="820" width="8" height="12" rx="2"/>
    <rect x="36" y="844" width="8" height="12" rx="2"/>

    <rect x="556" y="44" width="8" height="12" rx="2"/>
    <rect x="556" y="68" width="8" height="12" rx="2"/>
    <rect x="556" y="92" width="8" height="12" rx="2"/>
    <rect x="556" y="796" width="8" height="12" rx="2"/>
    <rect x="556" y="820" width="8" height="12" rx="2"/>
    <rect x="556" y="844" width="8" height="12" rx="2"/>
  </g>

  <!-- Center Glassmorphism Badge -->
  <g transform="translate(300, 390)" filter="url(#shadowFilter)">
    <!-- Outer Glow Circle -->
    <circle cx="0" cy="0" r="92" fill="#000000" fill-opacity="0.45" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="76" fill="#14151b" fill-opacity="0.8" stroke="rgba(229,9,20,0.35)" stroke-width="1.5"/>

    <!-- Iconic Red 'N' Ribbon Motif -->
    <g transform="translate(-32, -48)">
      <!-- Left leg -->
      <path d="M 0 0 L 18 0 L 18 96 L 0 96 Z" fill="url(#redN1)"/>
      <!-- Right leg -->
      <path d="M 46 0 L 64 0 L 64 96 L 46 96 Z" fill="url(#redN1)"/>
      <!-- Diagonal banner crossing -->
      <path d="M 0 0 L 22 0 L 64 96 L 42 96 Z" fill="url(#redN2)" filter="url(#shadowFilter)"/>
    </g>
  </g>

  <!-- Title & Typography Section -->
  <g transform="translate(300, 545)" text-anchor="middle">
    <!-- Brand Name -->
    <text y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="6">NANAFLIX</text>

    <!-- Subtitle / Tagline -->
    <text y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" fill="#e50914" letter-spacing="4">OFFICIAL SELECTION</text>

    <!-- Pill Tag -->
    <g transform="translate(-75, 58)">
      <rect width="150" height="26" rx="13" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="75" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="rgba(255,255,255,0.6)" letter-spacing="2" text-anchor="middle">CINEMA ARTWORK</text>
    </g>
  </g>

  <!-- Bottom Details Accent -->
  <line x1="160" y1="740" x2="440" y2="740" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="300" y="765" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11" fill="rgba(255,255,255,0.3)" letter-spacing="3" text-anchor="middle">PREMIUM STREAMING</text>
</svg>