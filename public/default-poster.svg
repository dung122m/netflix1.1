<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <!-- Deep clean dark cinema gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141417"/>
      <stop offset="50%" stop-color="#0c0c0e"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>

    <!-- Very subtle ambient glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e50914" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e50914" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes iconPulse {
      0%, 100% {
        transform: scale(0.98);
        opacity: 0.88;
      }
      50% {
        transform: scale(1.02);
        opacity: 1;
      }
    }
    .cinema-icon-badge {
      transform-origin: 300px 450px;
      animation: iconPulse 3.2s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .cinema-icon-badge {
        animation: none;
      }
    }
  </style>

  <!-- Background -->
  <rect width="600" height="900" fill="url(#bg)"/>

  <!-- Soft Ambient Glow -->
  <circle cx="300" cy="450" r="140" fill="url(#glow)"/>

  <!-- Minimal Cinema Badge -->
  <g class="cinema-icon-badge" transform="translate(300, 450)">
    <!-- Clean Minimal Frosted Circle -->
    <circle
      cx="0"
      cy="0"
      r="44"
      fill="rgba(255, 255, 255, 0.035)"
      stroke="rgba(255, 255, 255, 0.08)"
      stroke-width="1.5"
    />

    <!-- Minimal Film Icon (Clean, uncluttered, iconic) -->
    <g transform="translate(-24, -24) scale(2)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="18" height="18" x="3" y="3" rx="2.5" stroke="#71717a"/>
      <path d="M7 3v18" stroke="#71717a"/>
      <path d="M3 7.5h4" stroke="#71717a"/>
      <path d="M3 12h18" stroke="#71717a"/>
      <path d="M3 16.5h4" stroke="#71717a"/>
      <path d="M17 3v18" stroke="#71717a"/>
      <path d="M17 7.5h4" stroke="#71717a"/>
      <path d="M17 16.5h4" stroke="#71717a"/>
      <!-- Centered Play Glyph -->
      <polygon points="10.5,9.5 14.5,12 10.5,14.5" fill="#e50914" stroke="none"/>
    </g>
  </g>
</svg>
