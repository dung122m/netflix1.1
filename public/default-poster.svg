<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <!-- Background Gradient: Clean, deep, subtle dark cinema -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14151a"/>
      <stop offset="50%" stop-color="#0d0e12"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>

    <!-- Vietnam Flag Pill Red Gradient -->
    <linearGradient id="flagRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EA1D24"/>
      <stop offset="100%" stop-color="#DA251D"/>
    </linearGradient>

    <!-- Vietnam Star Gold Gradient -->
    <linearGradient id="starGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF200"/>
      <stop offset="100%" stop-color="#FFDE00"/>
    </linearGradient>
  </defs>

  <!-- Clean Minimal Dark Background -->
  <rect width="600" height="900" fill="url(#bg)"/>

  <!-- Center Minimal Nanaflix Brand Logo -->
  <g transform="translate(165, 425)">
    <!-- Nút đỏ bo góc chuẩn cờ Việt Nam (64x46, rx=13) -->
    <rect x="0" y="0" width="64" height="46" rx="13" fill="url(#flagRed)"/>
    
    <!-- Ngôi sao vàng 5 cánh ở chính giữa -->
    <polygon points="
      32,10
      35.5,20.5
      46.5,20.5
      37.5,27
      41,37.5
      32,31
      23,37.5
      26.5,27
      17.5,20.5
      28.5,20.5
    " fill="url(#starGold)"/>

    <!-- Chữ Nanaflix Bold Sans Trắng Tuyết Tối Giản -->
    <text
      x="80"
      y="35"
      fill="#FFFFFF"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', Arial, sans-serif"
      font-weight="800"
      font-size="42"
      letter-spacing="-1px"
    >
      Nanaflix
    </text>
  </g>
</svg>