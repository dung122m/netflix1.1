<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <!-- Background Gradient: Clean, deep, subtle dark cinema -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14151a"/>
      <stop offset="50%" stop-color="#0d0e12"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>

    <!-- Vietnam Flag Pill Red Gradient -->
    <linearGradient id="flagRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EA1D24"/>
      <stop offset="100%" stop-color="#DA251D"/>
    </linearGradient>

    <!-- Vietnam Star Gold Gradient -->
    <linearGradient id="starGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF200"/>
      <stop offset="100%" stop-color="#FFDE00"/>
    </linearGradient>

    <!-- Subtle Shimmer Wave Gradient Sweep -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;150%" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;250%" dur="2.4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes logoPulse {
      0%, 100% {
        transform: scale(0.98);
        opacity: 0.88;
        filter: drop-shadow(0 0 10px rgba(234, 29, 36, 0.25));
      }
      50% {
        transform: scale(1.02);
        opacity: 1;
        filter: drop-shadow(0 0 22px rgba(234, 29, 36, 0.55));
      }
    }
    .logo-container {
      transform-origin: 300px 450px;
      animation: logoPulse 2.8s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .logo-container {
        animation: none;
      }
    }
  </style>

  <!-- Clean Minimal Dark Background -->
  <rect width="600" height="900" fill="url(#bg)"/>

  <!-- Shimmer Wave Effect -->
  <rect width="600" height="900" fill="url(#shimmer)"/>

  <!-- Center Minimal Nanaflix Brand Logo with smooth breathing effect -->
  <g class="logo-container" transform="translate(165, 425)">
    <!-- Nút đỏ bo góc chuẩn cờ Việt Nam (64x46, rx=13) -->
    <rect x="0" y="0" width="64" height="46" rx="13" fill="url(#flagRed)"/>
    
    <!-- Ngôi sao vàng 5 cánh ở chính giữa -->
    <polygon points="
      32,10
      35.5,20.5
      46.5,20.5
      37.5,27
      41,37.5
      32,31
      23,37.5
      26.5,27
      17.5,20.5
      28.5,20.5
    " fill="url(#starGold)"/>

    <!-- Chữ Nanaflix Bold Sans Trắng Tuyết Tối Giản -->
    <text
      x="80"
      y="35"
      fill="#FFFFFF"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', Arial, sans-serif"
      font-weight="800"
      font-size="42"
      letter-spacing="-1px"
    >
      Nanaflix
    </text>
  </g>
</svg>