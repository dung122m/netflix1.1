<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" fill="none">
  <defs>
    <linearGradient id="qpvn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B71C1C" />
      <stop offset="100%" stop-color="#880E4F" />
    </linearGradient>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FFD700" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Shield Badge -->
  <rect x="100" y="40" width="760" height="280" rx="40" fill="url(#qpvn-grad)" stroke="#FFD700" stroke-width="10"/>

  <!-- Golden Star -->
  <g transform="translate(230, 180) scale(1.1)" filter="url(#gold-glow)">
    <polygon points="0,-75 22,-22 80,-22 34,14 52,68 0,35 -52,68 -34,14 -80,-22 -22,-22" fill="#FFD700" stroke="#FFF" stroke-width="3"/>
  </g>

  <!-- QPVN Big Letters -->
  <text x="560" y="195" font-family="'Arial Black', Impact, sans-serif" font-size="160" font-weight="900" font-style="italic" fill="#FFFFFF" letter-spacing="2">QPVN</text>
  
  <!-- Subtitle: QUỐC PHÒNG VIỆT NAM -->
  <rect x="360" y="225" width="460" height="50" rx="16" fill="#1B5E20" stroke="#FFD700" stroke-width="3"/>
  <text x="590" y="260" font-family="'Arial Black', 'Montserrat', sans-serif" font-size="26" font-weight="900" fill="#FFD700" text-anchor="middle" letter-spacing="3">QUỐC PHÒNG VIỆT NAM</text>
</svg>