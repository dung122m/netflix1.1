<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" fill="none">
  <defs>
    <linearGradient id="grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B1FA2" />
      <stop offset="100%" stop-color="#7B1FA2" stop-opacity="0.85" />
    </linearGradient>
    <filter id="shadow-3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7B1FA2" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Badge Parallelogram -->
  <path d="M 120 45 L 680 45 L 600 315 L 40 315 Z" fill="url(#grad-3)" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round" filter="url(#shadow-3)" />
  
  <!-- Inside Letters: THVL -->
  <g transform="translate(100, 235) skewX(-16)">
    <text x="0" y="0" font-family="'Arial Black', Impact, sans-serif" font-size="165" font-weight="900" font-style="italic" fill="#FFFFFF" letter-spacing="-2">THVL</text>
  </g>
  
  <!-- Channel Number Box -->
  <g transform="translate(680, 45)">
    <path d="M 60 0 L 220 0 L 150 270 L -10 270 Z" fill="#FFFFFF" stroke="#7B1FA2" stroke-width="10" stroke-linejoin="round"/>
    <text x="105" y="210" font-family="'Arial Black', Impact, sans-serif" font-size="220" font-weight="900" font-style="italic" fill="#7B1FA2" text-anchor="middle">3</text>
  </g>
  
  <!-- Subtitle Pill -->
  
  <g transform="translate(240, 275) skewX(-14)">
    <rect x="0" y="0" width="320" height="52" rx="14" fill="#000000" stroke="#FFFFFF" stroke-width="3" opacity="0.92"/>
    <text x="160" y="36" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="26" font-weight="900" fill="#FF80AB" text-anchor="middle">PHIM HAY</text>
  </g>
</svg>